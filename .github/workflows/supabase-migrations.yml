name: PartyHub database migrations

on:
  workflow_dispatch:
  push:
    branches: [main, initial-partyhub-draft]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"

permissions:
  contents: read

concurrency:
  group: partyhub-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Supabase GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          if [[ "$SUPABASE_PROJECT_ID" != "mqzjziaxbbozytumwsca" ]]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the configured PartyHub project."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Validate migration plan
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        run: supabase db push --linked --yes

      - name: Verify migration history
        run: supabase migration list --linked
